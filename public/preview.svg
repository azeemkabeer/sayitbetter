<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121118"/>
      <stop offset="50%" stop-color="#18171E"/>
      <stop offset="100%" stop-color="#0E0D13"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#99E600"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3399"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25232F" stroke-width="1" opacity="0.6"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="150" r="140" fill="#CCFF00" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="520" r="160" fill="#A855F7" opacity="0.09" filter="url(#glow)"/>
  <circle cx="600" cy="60" r="180" fill="#FF3399" opacity="0.05" filter="url(#glow)"/>

  <!-- Top App Bar / Header -->
  <g transform="translate(60, 45)">
    <!-- Mascot Goblin Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#24222E" stroke="#CCFF00" stroke-width="2.5" filter="url(#shadow)"/>
      <!-- Goblin Face -->
      <circle cx="28" cy="28" r="16" fill="#CCFF00"/>
      <!-- Ears -->
      <polygon points="12,24 4,14 16,18" fill="#99E600"/>
      <polygon points="44,24 52,14 40,18" fill="#99E600"/>
      <!-- Eyes & Smile -->
      <circle cx="23" cy="26" r="2.5" fill="#121118"/>
      <circle cx="33" cy="26" r="2.5" fill="#121118"/>
      <path d="M 23 33 Q 28 38 33 33" stroke="#121118" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- App Title & Tagline -->
    <text x="72" y="32" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">SAY IT BETTER</text>
    <rect x="272" y="14" width="138" height="24" rx="12" fill="#25232F" stroke="#CCFF00" stroke-width="1.5"/>
    <text x="341" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#CCFF00" text-anchor="middle" letter-spacing="1">TONE CALIBRATOR</text>
    <text x="72" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="13" fill="#A1A1AA">Turn raw, emotional, or blunt drafts into calibrated, high-impact messages</text>

    <!-- Top Feature Tags -->
    <g transform="translate(740, 6)">
      <!-- Voice Mic Badge -->
      <g transform="translate(0, 0)">
        <rect width="105" height="36" rx="8" fill="#24222E" stroke="#3F3D4D" stroke-width="1.5"/>
        <circle cx="20" cy="18" r="4" fill="#FF3399"/>
        <text x="56" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#E4E4E7" text-anchor="middle">🎙️ Voice Dictation</text>
      </g>
      <!-- WhatsApp Badge -->
      <g transform="translate(115, 0)">
        <rect width="115" height="36" rx="8" fill="#25D366" fill-opacity="0.15" stroke="#25D366" stroke-width="1.5"/>
        <text x="57" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#25D366" text-anchor="middle">💬 WhatsApp Sync</text>
      </g>
      <!-- Instagram Badge -->
      <g transform="translate(240, 0)">
        <rect width="100" height="36" rx="8" fill="#FF3399" fill-opacity="0.15" stroke="#FF3399" stroke-width="1.5"/>
        <text x="50" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FF3399" text-anchor="middle">📸 Instagram DM</text>
      </g>
    </g>
  </g>

  <!-- Input Draft Box Mockup -->
  <g transform="translate(60, 130)">
    <rect width="1080" height="120" rx="14" fill="#1F1D26" stroke="#34323F" stroke-width="2" filter="url(#shadow)"/>
    <!-- Label -->
    <text x="24" y="32" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#CCFF00" letter-spacing="1.5">RAW DRAFT INPUT</text>
    <rect x="150" y="18" width="130" height="20" rx="10" fill="#2D2B37"/>
    <text x="215" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#A1A1AA" text-anchor="middle">Recipient: Passive Boss</text>
    <!-- Sample Draft Text -->
    <text x="24" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#F4F4F5">"I literally already sent this report three days ago, please check your inbox before pinging me again."</text>
    <!-- Calibration Sliders Mini Preview -->
    <g transform="translate(24, 88)">
      <text x="0" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#71717A">WARMTH</text>
      <rect x="65" y="6" width="100" height="8" rx="4" fill="#2D2B37"/>
      <rect x="65" y="6" width="35" height="8" rx="4" fill="#CCFF00"/>

      <text x="200" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#71717A">ASSERTIVENESS</text>
      <rect x="305" y="6" width="100" height="8" rx="4" fill="#2D2B37"/>
      <rect x="305" y="6" width="85" height="8" rx="4" fill="#FF3399"/>

      <text x="440" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#71717A">BREVITY</text>
      <rect x="505" y="6" width="100" height="8" rx="4" fill="#2D2B37"/>
      <rect x="505" y="6" width="70" height="8" rx="4" fill="#A855F7"/>
    </g>
    <!-- Action Pill Button -->
    <g transform="translate(930, 36)">
      <rect width="126" height="48" rx="10" fill="url(#limeGrad)" filter="url(#shadow)"/>
      <text x="63" y="29" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14" fill="#121118" text-anchor="middle">CALIBRATE ⚡</text>
    </g>
  </g>

  <!-- Output Cards Showcase (3 Columns) -->
  <g transform="translate(60, 275)">
    <!-- CARD 1: READY TO SEND -->
    <g transform="translate(0, 0)">
      <rect width="345" height="340" rx="16" fill="#1F1D26" stroke="#CCFF00" stroke-width="2.5" filter="url(#shadow)"/>
      <!-- Header Pill -->
      <rect x="20" y="20" width="150" height="28" rx="8" fill="#CCFF00"/>
      <text x="95" y="38" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" fill="#121118" text-anchor="middle">✓ READY TO SEND</text>
      <!-- Subtext -->
      <text x="20" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#A1A1AA">Polished • Professional • Clear</text>
      <!-- Card Message Body -->
      <rect x="20" y="90" width="305" height="150" rx="12" fill="#15141B" stroke="#2B2936" stroke-width="1.5"/>
      <text x="36" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" width="270">
        <tspan x="36" dy="0">"Hi! I forwarded the updated</tspan>
        <tspan x="36" dy="24">report earlier this Tuesday. Let</tspan>
        <tspan x="36" dy="24">me know if you need me to</tspan>
        <tspan x="36" dy="24">resend the attachment."</tspan>
      </text>
      <!-- Card Footer Actions -->
      <g transform="translate(20, 260)">
        <rect width="70" height="36" rx="8" fill="#2A2835" stroke="#3F3D4D" stroke-width="1"/>
        <text x="35" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Copy</text>

        <rect x="80" y="0" width="105" height="36" rx="8" fill="#25D366" fill-opacity="0.2" stroke="#25D366" stroke-width="1.5"/>
        <text x="132" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#25D366" text-anchor="middle">WhatsApp</text>

        <rect x="195" y="0" width="110" height="36" rx="8" fill="#FF3399" fill-opacity="0.2" stroke="#FF3399" stroke-width="1.5"/>
        <text x="250" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FF3399" text-anchor="middle">Instagram</text>
      </g>
    </g>

    <!-- CARD 2: FUNNIER ALTERNATIVE -->
    <g transform="translate(365, 0)">
      <rect width="345" height="340" rx="16" fill="#1F1D26" stroke="#A855F7" stroke-width="2.5" filter="url(#shadow)"/>
      <!-- Header Pill -->
      <rect x="20" y="20" width="180" height="28" rx="8" fill="url(#purpleGrad)"/>
      <text x="110" y="38" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">✨ FUNNIER ALTERNATIVE</text>
      <!-- Subtext -->
      <text x="20" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#A1A1AA">Disarming • Charming • Warm</text>
      <!-- Card Message Body -->
      <rect x="20" y="90" width="305" height="150" rx="12" fill="#15141B" stroke="#2B2936" stroke-width="1.5"/>
      <text x="36" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">
        <tspan x="36" dy="0">"Good news: I already sent it</tspan>
        <tspan x="36" dy="24">three days ago! Bad news: your</tspan>
        <tspan x="36" dy="24">inbox might be secretly</tspan>
        <tspan x="36" dy="24">eating my PDFs for breakfast."</tspan>
      </text>
      <!-- Card Footer Actions -->
      <g transform="translate(20, 260)">
        <rect width="70" height="36" rx="8" fill="#2A2835" stroke="#3F3D4D" stroke-width="1"/>
        <text x="35" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Copy</text>

        <rect x="80" y="0" width="105" height="36" rx="8" fill="#25D366" fill-opacity="0.2" stroke="#25D366" stroke-width="1.5"/>
        <text x="132" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#25D366" text-anchor="middle">WhatsApp</text>

        <rect x="195" y="0" width="110" height="36" rx="8" fill="#FF3399" fill-opacity="0.2" stroke="#FF3399" stroke-width="1.5"/>
        <text x="250" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FF3399" text-anchor="middle">Instagram</text>
      </g>
    </g>

    <!-- CARD 3: FULL PERSONALITY MODE -->
    <g transform="translate(730, 0)">
      <rect width="350" height="340" rx="16" fill="#1F1D26" stroke="#FF3399" stroke-width="2.5" filter="url(#shadow)"/>
      <!-- Header Pill -->
      <rect x="20" y="20" width="195" height="28" rx="8" fill="url(#pinkGrad)"/>
      <text x="117" y="38" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">🔥 FULL PERSONALITY MODE</text>
      <!-- Subtext -->
      <text x="20" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#A1A1AA">Direct • Spicy • Boundary-Setting</text>
      <!-- Card Message Body -->
      <rect x="20" y="90" width="310" height="150" rx="12" fill="#15141B" stroke="#2B2936" stroke-width="1.5"/>
      <text x="36" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF">
        <tspan x="36" dy="0">"Check Tuesday's email chain;</tspan>
        <tspan x="36" dy="24">it's right there timestamped</tspan>
        <tspan x="36" dy="24">and ready. Saves us both</tspan>
        <tspan x="36" dy="24">a frantic search!"</tspan>
      </text>
      <!-- Card Footer Actions -->
      <g transform="translate(20, 260)">
        <rect width="70" height="36" rx="8" fill="#2A2835" stroke="#3F3D4D" stroke-width="1"/>
        <text x="35" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">Copy</text>

        <rect x="80" y="0" width="105" height="36" rx="8" fill="#25D366" fill-opacity="0.2" stroke="#25D366" stroke-width="1.5"/>
        <text x="132" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#25D366" text-anchor="middle">WhatsApp</text>

        <rect x="195" y="0" width="110" height="36" rx="8" fill="#FF3399" fill-opacity="0.2" stroke="#FF3399" stroke-width="1.5"/>
        <text x="250" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#FF3399" text-anchor="middle">Instagram</text>
      </g>
    </g>
  </g>
</svg>
